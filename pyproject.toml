[project]
name = "trading-lab"
version = "0.1.0"
description = "BTC / GLD / QQQ research backtest and latest-signal replay (not live trading)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "vectorbt==1.2.1",
  "streamlit",
  "pandas",
  "pyyaml",
  "yfinance",
  "pandas-market-calendars",
]

[project.optional-dependencies]
dev = ["pytest"]
piia = ["fastapi", "uvicorn[standard]", "pydantic", "sqlalchemy", "alembic", "httpx", "python-multipart", "streamlit"]

[project.scripts]
trading-lab = "trading_lab.cli:main"
piia = "piia.intelligence.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
