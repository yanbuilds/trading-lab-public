[project]
name = "trading-lab"
version = "0.2.0"
description = "Multi-regime trading decision assistant, risk ticket calculator, walk-forward backtester, and research audit lab (no live order routing)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
etf = ["vectorbt==1.2.1", "streamlit", "yfinance", "pandas-market-calendars"]
perps = ["ccxt", "TA-Lib", "httpx"]
piia = ["fastapi", "uvicorn[standard]", "pydantic", "sqlalchemy", "alembic", "httpx", "python-multipart", "streamlit", "altair", "langgraph"]
forecast = ["chronos-forecasting"]

[project.scripts]
trading-lab = "trading_lab.cli:main"
piia = "piia.intelligence.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore:Converting to Period representation will drop timezone information:UserWarning:trading_lab\\.perps\\.compare",
]
