[alembic]
script_location = piia_alembic
prepend_sys_path = src
path_separator = os
# Local Phase-1 default. PostgreSQL URLs are accepted by migrations
# but PostgreSQL itself is not tested in this slice.
sqlalchemy.url = sqlite:///data/piia/piia.dev.sqlite

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
